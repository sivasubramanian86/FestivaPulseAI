name: FestivaPulseAI Enterprise CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  security-and-secret-scanning:
    name: Gitleaks & Bandit SAST Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit SAST
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Execute Bandit SAST Scan
        run: |
          bandit -r backend/app -ll -ii

  backend-quality-gates:
    name: Backend Unit, Integration, E2E & 95%+ Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Run Unit Tests
        run: |
          pytest backend/tests/unit -v -m unit

      - name: Run Integration Tests
        run: |
          pytest backend/tests/integration -v -m integration

      - name: Run E2E Lifecycle Tests
        run: |
          pytest backend/tests/e2e -v -m e2e

      - name: Enforce Strict 100% Code Coverage
        run: |
          pytest backend/tests -v --cov=backend.app --cov-report=term-missing --cov-fail-under=100

  frontend-quality-gates:
    name: Frontend Unit, Integration, E2E Vitest & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Classified Vitest Suite (Unit, Integration, E2E)
        working-directory: frontend
        run: npm test -- --run

      - name: Build Production Frontend Bundle
        working-directory: frontend
        run: npm run build

  repo-size-governance:
    name: Lean Repository Gate (< 10 MB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Repository Size
        run: |
          REPO_SIZE_KB=$(git count-objects -v | grep 'size-pack' | awk '{print $2}')
          if [ -z "$REPO_SIZE_KB" ]; then
            REPO_SIZE_KB=$(git count-objects -v | grep 'size' | head -1 | awk '{print $2}')
          fi
          echo "Current Git Objects Size: ${REPO_SIZE_KB} KB"
          if [ "$REPO_SIZE_KB" -gt 10240 ]; then
            echo "ERROR: Repository git size exceeds 10 MB threshold!"
            exit 1
          fi
          echo "SUCCESS: Repository size strictly under 10 MB."
