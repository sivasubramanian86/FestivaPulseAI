name: FestivaPulseAI Enterprise CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-quality-gates:
    name: Backend Pytest, Ruff & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Run Pytest Suite with Coverage
        run: |
          pytest backend/tests -v --cov=backend.app --cov-report=term-missing --cov-fail-under=85

  frontend-quality-gates:
    name: Frontend Vitest & TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Component Test Suite
        working-directory: frontend
        run: npm test

      - name: Build Production Frontend Bundle
        working-directory: frontend
        run: npm run build

  repo-size-governance:
    name: Lean Repository Gate (< 10 MB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Repository Size
        run: |
          REPO_SIZE_KB=$(git count-objects -v | grep 'size-pack' | awk '{print $2}')
          if [ -z "$REPO_SIZE_KB" ]; then
            REPO_SIZE_KB=$(git count-objects -v | grep 'size' | head -1 | awk '{print $2}')
          fi
          echo "Current Git Objects Size: ${REPO_SIZE_KB} KB"
          if [ "$REPO_SIZE_KB" -gt 10240 ]; then
            echo "ERROR: Repository git size exceeds 10 MB threshold!"
            exit 1
          fi
          echo "SUCCESS: Repository size strictly under 10 MB."
